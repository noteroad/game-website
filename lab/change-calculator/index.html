@media(max-width:359px){.app{padding-bottom:calc(88px + env(safe-area-inset-bottom))}.money-row,.money-row:last-child{padding:10px}.money-name{font-size:15px}.step-badge{padding:0 5px;font-size:9px}.row-amount{font-size:14px}.row-controls{gap:6px;margin-top:8px}.quick-group{gap:4px}.quick-btn{height:36px;min-width:40px;padding:0 6px;font-size:12px}.stepper{grid-template-columns:38px 52px 38px;height:38px}.stepper .qty{width:52px;font-size:16px}.actions{width:calc(100% - 20px);padding-top:8px}}
@media(min-width:520px){.money-row,.money-row:last-child{display:block;padding:13px 16px}.money-info{display:flex}.row-controls{margin-top:10px}.quick-btn{min-width:52px}.stepper{grid-template-columns:48px 72px 48px}.stepper .qty{width:72px}.actions{width:min(calc(100% - 32px),528px)}}
</style>
<script>
const DENOMS=[{value:50000,label:'5만원권',enabled:true,step:1,fast:false,fastStep:10},{value:10000,label:'1만원권',enabled:true,step:1,fast:false,fastStep:10},{value:5000,label:'5천원권',enabled:true,step:1,fast:true,fastStep:10},{value:1000,label:'1천원권',enabled:true,step:1,fast:true,fastStep:10},{value:500,label:'500원',enabled:true,step:40,fast:false,fastStep:80,bundle:40},{value:100,label:'100원',enabled:true,step:50,fast:false,fastStep:100,bundle:50},{value:50,label:'50원',enabled:true,step:50,fast:false,fastStep:100,bundle:50},{value:10,label:'10원',enabled:false,step:50,fast:false,fastStep:100,bundle:50}];
const KEYS={state:'change-calc-state-v2',settings:'change-calc-settings-v2',history:'change-calc-history-v2'},nf=new Intl.NumberFormat('ko-KR'),$=s=>document.querySelector(s);let settings=load(KEYS.settings,DENOMS),state=load(KEYS.state,{}),history=load(KEYS.history,[]),pendingSettings=null;
function clone(v){return JSON.parse(JSON.stringify(v))}function load(key,fallback){try{const value=JSON.parse(localStorage.getItem(key));return value??clone(fallback)}catch(_){return clone(fallback)}}function persist(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(_){}}function normalizedSettings(){return DENOMS.map(base=>{const saved=settings.find(x=>Number(x.value)===base.value)||{};return {...base,...saved,value:base.value,label:base.label,step:Math.max(1,Number(saved.step||base.step)),fastStep:Math.max(1,Number(saved.fastStep||base.fastStep)),bundle:base.bundle?Math.max(1,Number(saved.bundle||base.bundle)):undefined}})}
function render(){settings=normalizedSettings();$('#moneyList').innerHTML=settings.filter(x=>x.enabled).map(d=>{const qty=Math.max(0,parseInt(state[d.value],10)||0),badge=d.bundle?`<span class="step-badge bundle">${Math.floor(qty/d.bundle)}묶음+${qty%d.bundle}개</span>`:d.step>1?`<span class="step-badge">${d.step}개씩</span>`:'',quick=d.fast?`<button class="quick-btn" data-delta="-${d.fastStep}" type="button">−${d.fastStep}</button><button class="quick-btn" data-delta="${d.fastStep}" type="button">+${d.fastStep}</button>`:d.step>1?`<span class="unit-note">± ${d.step}개씩</span>`:'';return `<div class="money-row" data-value="${d.value}"><div class="money-info"><div class="denomination"><span class="money-name">${d.label}</span>${badge}</div><div class="amount-group"><span class="row-amount">${nf.format(qty*d.value)}원</span><button class="row-reset ${qty?'':'hidden'}" type="button" aria-label="${d.label} 초기화">×</button></div></div><div class="row-controls"><div class="quick-group">${quick}</div><div class="stepper"><button class="base-step" data-delta="-${d.step}" type="button" aria-label="${d.label} ${d.step}개 빼기">−</button><input class="qty" type="number" inputmode="numeric" pattern="[0-9]*" min="0" step="1" value="${qty}" aria-label="${d.label} 수량"><button class="base-step" data-delta="${d.step}" type="button" aria-label="${d.label} ${d.step}개 더하기">＋</button></div></div></div>`}).join('');calculate()}
function calculate(){let total=0;document.querySelectorAll('.money-row').forEach(row=>{const value=Number(row.dataset.value),input=row.querySelector('.qty'),qty=Math.max(0,parseInt(input.value,10)||0),d=settings.find(x=>x.value===value);input.value=qty;state[value]=qty;total+=value*qty;row.querySelector('.row-amount').textContent=`${nf.format(value*qty)}원`;row.querySelector('.row-reset').classList.toggle('hidden',qty===0);const bundle=row.querySelector('.bundle');if(bundle)bundle.textContent=`${Math.floor(qty/d.bundle)}묶음+${qty%d.bundle}개`});$('#totalAmount').textContent=nf.format(total);persist(KEYS.state,state);return total}
function nonzeroItems(source=state){return settings.map(d=>({value:d.value,label:d.label,qty:Math.max(0,Number(source[d.value])||0),bundle:d.bundle})).filter(x=>x.qty>0)}function summary(items){return items.map(x=>`${x.label} ${nf.format(x.qty)}개`).join(' · ')}function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1600)}function open(id){$(id).classList.add('open')}function closeOverlay(el){el.closest('.overlay').classList.remove('open')}
$('#moneyList').addEventListener('click',e=>{const row=e.target.closest('.money-row');if(!row)return;if(e.target.closest('.row-reset')){state[row.dataset.value]=0;row.querySelector('.qty').value=0;calculate();toast(`${settings.find(x=>x.value===Number(row.dataset.value)).label}을 초기화했습니다`);return}const btn=e.target.closest('[data-delta]');if(!btn)return;const input=row.querySelector('.qty');input.value=Math.max(0,(parseInt(input.value,10)||0)+Number(btn.dataset.delta));calculate()});$('#moneyList').addEventListener('input',calculate);$('#resetBtn').addEventListener('click',()=>{if(!nonzeroItems().length)return;state={};render();toast('전체 수량을 초기화했습니다')});
function renderSettings(list){$('#settingsList').innerHTML=list.map((d,i)=>`<div class="setting-card" data-index="${i}"><div class="setting-top"><span class="setting-title">${d.label}</span><label class="switch"><input class="enabled" type="checkbox" aria-label="${d.label} 표시 여부" ${d.enabled?'checked':''}><span class="slider"></span></label></div><div class="setting-grid"><div class="field"><label>기본 증감 단위</label><input class="base-step" type="number" inputmode="numeric" min="1" value="${d.step}" aria-label="${d.label} 기본 증감 단위"></div>${d.bundle?`<div class="field"><label>한 묶음 개수</label><input class="bundle-step" type="number" inputmode="numeric" min="1" value="${d.bundle}" aria-label="${d.label} 한 묶음 개수"></div>`:''}<div class="field full"><label class="check-row"><input class="fast-enabled" type="checkbox" ${d.fast?'checked':''}> 빠른 증감 버튼 사용</label></div><div class="field"><label>빠른 증감 단위</label><input class="fast-step" type="number" inputmode="numeric" min="1" value="${d.fastStep}" aria-label="${d.label} 빠른 증감 단위" ${d.fast?'':'disabled'}></div></div></div>`).join('')}
$('#settingsBtn').addEventListener('click',()=>{pendingSettings=clone(settings);renderSettings(pendingSettings);open('#settingsOverlay')});$('#settingsList').addEventListener('change',e=>{const card=e.target.closest('.setting-card');if(!card)return;if(e.target.classList.contains('fast-enabled'))card.querySelector('.fast-step').disabled=!e.target.checked});$('#defaultSettings').addEventListener('click',()=>{pendingSettings=clone(DENOMS);renderSettings(pendingSettings)});$('#applySettings').addEventListener('click',()=>{document.querySelectorAll('.setting-card').forEach(card=>{const i=Number(card.dataset.index),d=pendingSettings[i];d.enabled=card.querySelector('.enabled').checked;d.fast=card.querySelector('.fast-enabled').checked;d.step=Math.max(1,Number(card.querySelector('.base-step').value)||1);d.fastStep=Math.max(1,Number(card.querySelector('.fast-step').value)||1);const bundle=card.querySelector('.bundle-step');if(bundle)d.bundle=Math.max(1,Number(bundle.value)||1)});settings=pendingSettings;persist(KEYS.settings,settings);render();$('#settingsOverlay').classList.remove('open');toast('설정을 적용했습니다')});
$('#saveBtn').addEventListener('click',()=>{const items=nonzeroItems(),total=calculate();if(!items.length){toast('저장할 수량을 입력해주세요');return}const id=Date.now();history.unshift({id,createdAt:new Date().toISOString(),memo:'',total,items:items.map(({value,label,qty,bundle})=>({value,label,qty,bundle}))});history=history.slice(0,200);persist(KEYS.history,history);updateHistoryDot();showDetail(id);open('#historyOverlay');toast('교환 내역을 저장했습니다')});
function formatDate(iso){return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso))}function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function renderHistory(){$('#historyTitle').textContent='저장 내역';$('#historyBody').innerHTML=history.length?`<div class="history-list">${history.map(h=>`<button class="history-item" data-id="${h.id}" type="button"><span><span class="history-date">${formatDate(h.createdAt)}</span><br><strong class="history-total">${nf.format(h.total)}원</strong></span><span class="chevron">›</span><span class="history-summary">${h.memo?`${escapeHtml(h.memo)} · `:''}${summary(h.items)}</span></button>`).join('')}</div>`:`<div class="empty"><strong>저장된 내역이 없습니다</strong>교환 내역을 저장하면 이곳에서 다시 확인할 수 있습니다.</div>`}
function showDetail(id){const h=history.find(x=>x.id===id);if(!h)return;$('#historyTitle').textContent='저장 내역 상세';$('#historyBody').innerHTML=`<div class="detail-card"><div class="detail-total"><small>${formatDate(h.createdAt)}</small><strong>${nf.format(h.total)}원</strong></div>${h.items.map(x=>`<div class="detail-row"><span>${x.label}${x.bundle?`<small>${Math.floor(x.qty/x.bundle)}묶음 + ${x.qty%x.bundle}개</small>`:''}</span><span>${nf.format(x.qty)}개<small>${nf.format(x.value*x.qty)}원</small></span></div>`).join('')}${h.memo?`<div class="memo">${escapeHtml(h.memo)}</div>`:''}<div class="detail-actions"><button class="action" data-action="back" type="button">목록</button><button class="action" data-action="load" data-id="${h.id}" type="button">불러오기</button><button class="action danger" data-action="delete" data-id="${h.id}" type="button">삭제</button></div></div>`}
$('#historyBtn').addEventListener('click',()=>{renderHistory();open('#historyOverlay')});$('#historyBody').addEventListener('click',e=>{const item=e.target.closest('.history-item');if(item){showDetail(Number(item.dataset.id));return}const action=e.target.closest('[data-action]');if(!action)return;const id=Number(action.dataset.id);if(action.dataset.action==='back'){renderHistory();return}if(action.dataset.action==='load'){const h=history.find(x=>x.id===id);if(!h)return;state={};h.items.forEach(x=>state[x.value]=x.qty);render();$('#historyOverlay').classList.remove('open');toast('저장 내역을 불러왔습니다')}if(action.dataset.action==='delete'){if(!confirm('이 저장 내역을 삭제할까요?'))return;history=history.filter(x=>x.id!==id);persist(KEYS.history,history);updateHistoryDot();renderHistory();toast('내역을 삭제했습니다')}});function updateHistoryDot(){$('#historyDot').classList.toggle('on',history.length>0)}document.querySelectorAll('.close').forEach(btn=>btn.addEventListener('click',()=>closeOverlay(btn)));document.querySelectorAll('.overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open')}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(x=>x.classList.remove('open'))});render();updateHistoryDot();
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script></body></html>
